[project]
name = "mojo-featuretools"
version = "0.1.0"
description = "Compute-heavy Featuretools primitives implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "featuretools"]

[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
